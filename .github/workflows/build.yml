name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ["1.20", "1.21"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run build script
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os == 'windows-latest' && 'windows' || '' }}
        run: |
          chmod +x scripts/build.sh || true
          ./scripts/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-server-${{ matrix.os }}
          path: build/bin
